    libraries "net.neoforged:AutoRenamingTool:${project.art_version}"
    libraries("net.kyori:adventure-api:4.24.0") // Youer M3: bumped, matches Paper 1.21.8's own pin
    libraries("net.kyori:adventure-key:4.24.0")
    libraries("net.kyori:adventure-text-logger-slf4j:4.24.0")
    libraries("net.kyori:adventure-text-serializer-ansi:4.24.0")
    libraries("net.kyori:adventure-text-minimessage:4.24.0")
    libraries("net.kyori:adventure-text-serializer-gson:4.24.0")
