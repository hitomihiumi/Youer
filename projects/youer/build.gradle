    libraries("net.kyori:adventure-text-serializer-legacy:4.24.0")
    libraries("net.kyori:adventure-text-serializer-plain:4.24.0")
    libraries("net.kyori:ansi:1.0.3")
    libraries("net.kyori:examination-api:1.3.0")
    libraries("net.kyori:examination-string:1.3.0")
    libraries("net.kyori:option:1.0.0")
    // Youer M3: io/papermc/asm (vendored plugin-rewrite bytecode framework) is no longer vendored by
    // Paper 1.21.8 - it was extracted into this published artifact (same io.papermc.asm.* packages).
    libraries("io.papermc:reflection-rewriter:0.0.3")
    libraries("io.papermc:reflection-rewriter-runtime:0.0.3")
    libraries("io.papermc:reflection-rewriter-proxy-generator:0.0.3")
    libraries("io.netty:netty-codec-haproxy:4.1.118.Final") // Youer M3: bumped, matches Paper 1.21.8's own pin
    libraries("com.velocitypowered:velocity-native:3.4.0-SNAPSHOT") {
        exclude group: 'io.netty'
    }
    // Paper end

    // LibraryLoader start
    libraries 'org.checkerframework:checker-qual:3.49.2' // Youer M3: bumped, matches Paper 1.21.8's own pin
    libraries 'org.eclipse.sisu:org.eclipse.sisu.inject:0.9.0.M2'
    libraries 'org.codehaus.plexus:plexus-interpolation:1.26'
    libraries 'org.codehaus.plexus:plexus-utils:3.5.1'
    libraries 'com.google.protobuf:protobuf-java:3.25.1'
    libraries('org.dom4j:dom4j:2.1.4') {
        exclude group: 'javax.xml.bind'
        exclude group: 'javax.xml.stream'
        exclude group: 'jaxen'
        exclude group: 'xpp3'
    }
    // LibraryLoader end

    // Pufferfish start
    libraries 'io.sentry:sentry:5.4.0'
    // libraries 'org.mozilla:rhino-engine:1.7.14'
    libraries 'dev.omega24:upnp4j:1.0'
    libraries ("com.github.carleslc.Simple-YAML:Simple-Yaml:1.8.4") { // Purpur
        exclude group: 'org.yaml'
    }
    // Pufferfish end
    libraries 'org.apache.commons:commons-compress:1.26.0'
    libraries 'com.github.luben:zstd-jni:1.5.7-8'

    // Youer M3: ca/spottedleaf/concurrentutil is no longer vendored by Paper/Purpur 1.21.8, it's a
