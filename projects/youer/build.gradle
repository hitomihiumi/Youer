    // writing). Blocker B6 in the plan; revisit once upstream catches up or drop the compat code.
    // compileOnly("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    // compileOnly("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    // compileOnly("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
}

neoDev {
    runs {
        configureEach {
            gameDirectory = layout.projectDir.dir("run/$name")
            systemProperty("terminal.ansi", "true")
        }
        client {
            client()
            loadedMods = [joinedMod, neoDev.mods."neoforge-coremods"]
        }

        server {
            server()
            loadedMods = [commonMod, neoDev.mods."neoforge-coremods"]
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods = [commonMod, neoDev.mods."neoforge-coremods"]
        }
        data {
            data()
            loadedMods = [joinedMod, neoDev.mods."neoforge-coremods"]
            programArguments.addAll '--mod', 'neoforge', '--flat', '--all', '--validate',
                    '--existing', rootProject.file("src/main/resources").absolutePath,
                    '--output', rootProject.file("src/generated/resources").absolutePath
        }
    }
}

tasks.withType(JavaCompile.class).configureEach {
    // Increase memory used during compilation, to avoid OutOfMemoryErrors
    options.forkOptions.memoryMaximumSize = '2g'
}

tasks.withType(Javadoc.class).configureEach {
    options.tags = [
            'apiNote:a:<em>API Note:</em>',
            'implSpec:a:<em>Implementation Requirements:</em>',
            'implNote:a:<em>Implementation Note:</em>'
    ]
    options.addStringOption('Xdoclint:all,-missing', '-public')
}

AdhocComponentWithVariants javaComponent = (AdhocComponentWithVariants) project.components.findByName("java")
// Ensure the two default variants are not published, since they
// contain Minecraft classes
javaComponent.withVariantsFromConfiguration(configurations.apiElements) {
    it.skip()
}
javaComponent.withVariantsFromConfiguration(configurations.runtimeElements) {
    it.skip()
}

// Resolvable configurations only
configurations {
    runtimeElements {
        attributes {
            // Add an attribute to disambiguate with the universalJar
            attribute(Attribute.of("net.neoforged.neoforge.includes-minecraft", Boolean), true)
        }
    }
    modDevBundle {
        canBeDeclared = false
        canBeResolved = false
        extendsFrom neoFormData
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, "data"))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
        outgoing {
            capability("net.neoforged:neoforge-moddev-bundle:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {} // Publish it
    }
    modDevConfig {
        canBeDeclared = false
        canBeResolved = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, "data"))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
        outgoing {
            capability("net.neoforged:neoforge-moddev-config:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {} // Publish it
    }
    installerJar {
        canBeDeclared = false
        canBeResolved = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EMBEDDED))
            // The installer targets JDK 8
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 8)
        }
        outgoing {
            capability("net.neoforged:neoforge-installer:${project.version}")
        }
        // Publish it
        javaComponent.addVariantsFromConfiguration(it) {}
    }
    universalJar {
        canBeDeclared = false
        canBeResolved = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, java_version as Integer)
            attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        }
        // Publish it
        javaComponent.addVariantsFromConfiguration(it) {}
    }

    modDevApiElements {
        canBeDeclared = false
        canBeResolved = false
        extendsFrom libraries, moduleLibraries, userdevCompileOnly, neoFormDependencies
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        }
        outgoing {
            capability("net.neoforged:neoforge-dependencies:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {}
    }
    modDevRuntimeElements {
        canBeDeclared = false
        canBeResolved = false
        extendsFrom libraries, moduleLibraries, neoFormDependencies
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
        outgoing {
            capability("net.neoforged:neoforge-dependencies:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {}
    }
    modDevModulePath {
        canBeDeclared = false
        canBeResolved = false
        extendsFrom moduleLibraries
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
        }
        outgoing {
            capability("net.neoforged:neoforge-moddev-module-path:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {}
    }
    modDevTestFixtures {
        canBeDeclared = false
        canBeResolved = false
        extendsFrom userdevTestFixtures
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
        outgoing {
            capability("net.neoforged:neoforge-moddev-test-fixtures:${project.version}")
        }
        javaComponent.addVariantsFromConfiguration(it) {}
    }
}

processResources {
    inputs.property("version", project.version)
    final version = project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand([
                "global": [
                        "neoForgeVersion": version
                ]
        ])
    }
}

artifacts {
    modDevBundle(userdevJar) {
        setClassifier("userdev") // Legacy
    }
    modDevConfig(writeUserDevConfig.userDevConfig) {
        setClassifier("moddev-config")
    }
    universalJar(universalJar) {
        setClassifier("universal")
    }
    installerJar(installerJar) {
        setClassifier("installer")
    }
}

// Youer M4: the old maven.mohistmc.com/libraries/1.21.1/youer/libraries.zip mirror is 1.21.1-only and
// there's no way to publish a 1.21.8 replacement to MohistMC's maven (see plan blocker B2). Rebuilt
// here from the two publicly-fetchable source artifacts instead: the vanilla server jar (Mojang
// piston-data, resolved via version_manifest_v2.json) and the neoform zip (already published on
// maven.neoforged.net under the same coordinate the build's own neoFormData dependency uses).
// The old bundle also carried standalone "-mappings.txt"/"-mappings-merged.txt" files; those are
// NFRT-local build outputs, not separately published anywhere, and are intentionally omitted here.
def download1218Libraries = tasks.register("download1218Libraries", Download) {
    src([
            'https://piston-data.mojang.com/v1/objects/6bce4ef400e4efaa63a13d5e6f6b500be969ef81/server.jar',
            "https://maven.neoforged.net/releases/net/neoforged/neoform/${project.minecraft_version}-${project.neoform_version}/neoform-${project.minecraft_version}-${project.neoform_version}.zip"
    ])
    dest layout.buildDirectory.dir("librariesRaw")
}

def downloadMultipleFiles = tasks.register("downloadMultipleFiles", Zip) {
    dependsOn download1218Libraries
    archiveFileName = "libraries.zip"
    destinationDirectory = layout.buildDirectory.dir("libraries")
    from(layout.buildDirectory.dir("librariesRaw").map { it.file("server.jar") }) {
        into "net/minecraft/server/${project.minecraft_version}"
        rename { "server-${project.minecraft_version}.jar" }
    }
    from(layout.buildDirectory.dir("librariesRaw").map { it.file("neoform-${project.minecraft_version}-${project.neoform_version}.zip") }) {
        into "net/neoforged/neoform/${project.minecraft_version}-${project.neoform_version}"
    }
}

configurations {
    installer {
        // Don't pull all libraries, if we're missing something, add it to the installer list so the installer knows to download it.
        transitive = false
    }
    // Youer: `libraries` is a Declarable-only dependencyScope configuration (NeoDevConfigurations),
    // it can no longer be resolved directly. Mirror it into a resolvable configuration for youerJar's
    // bundling step below. (`moduleLibraries` already has a resolvable counterpart: `modulePath`.)
    resolvedLibraries {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom libraries
    }
}

def installerDeps = {
    installer "net.neoforged.installertools:installertools:${project.installertools_version}"
    installer "net.neoforged.installertools:binarypatcher:${project.installertools_version}:fatjar"
    installer "net.neoforged.installertools:jarsplitter:${project.installertools_version}"
    installer "net.neoforged.installertools:cli-utils:${project.installertools_version}"
    installer "net.neoforged:AutoRenamingTool:${project.art_version}:all"
    installer "de.siegmar:fastcsv:2.0.0"
}

dependencies installerDeps

// Youer: registered lazily (tasks.register, not the eager `task name(type:) {}` form) — the eager
// form ran this configuration closure immediately during script evaluation, which forced early
// resolution of `resolvedLibraries`/`installer`/`modulePath` (and, via modulePath's
// shouldResolveConsistentlyWith(runtimeClasspath) wiring in NeoDevConfigurations, of
// `runtimeClasspath` itself) before moddevgradle's ModDevRunWorkflow got a chance to mutate
// runtimeClasspath's hierarchy for the run configurations, causing:
// "Cannot mutate the hierarchy of configuration ':youer:runtimeClasspath' after the configuration was resolved."
def youerJar = tasks.register("youerJar", Jar) {
    dependsOn(youerJar0, downloadMultipleFiles, project(':youerlauncher').tasks.named('jar'))
    archiveClassifier = 'server'
    archiveExtension = 'jar'
    archiveBaseName = 'youer'
    archiveVersion = '1.21.8-' + gradleutils.gitInfo.abbreviatedId
    destinationDirectory = file('build/libs')

    manifest {
        attributes([
                'Premain-Class': 'com.mohistmc.launcher.youer.util.JarLoader',
                'Launcher-Agent-Class': 'com.mohistmc.launcher.youer.util.JarLoader',
                'Main-Class': 'com.mohistmc.launcher.youer.Main'
        ])
        attributes([
                'Specification-Title'   : 'Youer',
                'Specification-Vendor'  : 'MohistMC',
                'Implementation-Title'  : 'Youer',
                'Implementation-Version': archiveVersion,
                'Implementation-Vendor' : 'MohistMC'
        ] as LinkedHashMap, 'com/mohistmc/launcher/youer/')
    }

    //println(CLASS_PATH)

    from(zipTree(project(':youerlauncher').tasks.named('jar').get().outputs.getFiles().asPath.replace(".jar", "-all.jar"))) {
        into ""
    }
    from(zipTree(youerJar0.outputs.getFiles().asPath)) {
        into ""
    }

    from(zipTree(downloadMultipleFiles.get().outputs.getFiles().asPath)) {
        into 'META-INF/libraries'
    }

    configurations.resolvedLibraries.resolvedConfiguration.resolvedArtifacts.collect {
        def moduleVersion = it.moduleVersion
        if (!moduleVersion.id.name.startsWith("asm") && !moduleVersion.id.name.startsWith("securejarhandler")) {
            from(it.file) {
                into("META-INF/libraries/${moduleVersion.id.group.replace('.', '/')}/${moduleVersion.id.name}/${moduleVersion.id.version}/")
            }
        }
    }
    configurations.installer.resolvedConfiguration.resolvedArtifacts.collect {
        def moduleVersion = it.moduleVersion
        from(it.file) {
            into("META-INF/libraries/${moduleVersion.id.group.replace('.', '/')}/${moduleVersion.id.name}/${moduleVersion.id.version}/")
        }
    }

    configurations.modulePath.resolvedConfiguration.resolvedArtifacts.collect {
        def moduleVersion = it.moduleVersion
        if (moduleVersion.id.name != "JarJarFileSystems") {
            from(it.file) {
                into("META-INF/libraries/${moduleVersion.id.group.replace('.', '/')}/${moduleVersion.id.name}/${moduleVersion.id.version}/")
            }
        }
    }

    from(rootProject.file('server_files/version.txt')) {
        filter(ReplaceTokens, tokens: [VERSION: gradleutils.gitInfo.abbreviatedId])
        rename { 'versions/youer.txt' }
    }
    from(rootProject.file('server_files/version.txt')) {
        filter(ReplaceTokens, tokens: [VERSION: minecraft_version])
        rename { 'versions/minecraft.txt' }
    }
    from(rootProject.file('server_files/version.txt')) {
        filter(ReplaceTokens, tokens: [VERSION: neoforge_version])
        rename { 'versions/neoforge.txt' }
    }
    from(rootProject.file('server_files/version.txt')) {
        filter(ReplaceTokens, tokens: [VERSION: minecraft_version + '-' + neoform_version])
        rename { 'versions/mcp.txt' }
    }
}

