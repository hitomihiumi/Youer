import org.gradle.process.CommandLineArgumentProvider
import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradleutils'
    id 'neoforge.versioning'
    id 'de.undercouch.download' version '5.6.0'
}

apply plugin: net.neoforged.neodev.NeoDevPlugin

// Because of the source set reference.
evaluationDependsOn(":neoforge-coremods")

gradleutils.setupSigning(project: project, signAllPublications: true)

sourceSets {
    main {
        java {
            srcDirs rootProject.file('src/main/java')
        }
        resources {
            srcDirs rootProject.file('src/main/resources'), rootProject.file('src/generated/resources')
        }
    }
    // Youer: empty on purpose — unlike upstream NeoForge, Youer never split client-only classes into
    // their own sourceSet (com/mojang/blaze3d etc. already live in sourceSets.main, see universalJar's
    // client-package excludes in buildSrc). This sourceSet/feature only exists so the buildSrc pipeline's
    // joinedJar/generate*BinPatches tasks (which unconditionally look for a "clientJar" task) resolve.
    client {
        java {
            srcDirs = []
        }
    }
}

java {
    registerFeature('client') {
        usingSourceSet(sourceSets.client)
        disablePublication()
    }
}

// Youer: jarcompatibilitychecker (JCC) plugin temporarily disabled for M1 (toolchain-only milestone) —
// it isn't part of Youer's CI critical path (setup + youerJar) and its interaction with the new
// moddevgradle 2.0.107 ModDevRunWorkflow needs isolated debugging. Revisit at M6.
// See C:\Users\esdev\.claude\plans\drifting-munching-creek.md

// Youer: no separate client sourceSet (single unified sourceSets.main, client+server merged
// like upstream NeoForge's "joined" mod) so commonMod and joinedMod are the same thing here.
// The ModModel must be named "minecraft" for FML to work.
ext.commonMod = objects.newInstance(net.neoforged.moddevgradle.dsl.ModModel, "minecraft")
commonMod.sourceSet sourceSets.main
ext.joinedMod = commonMod

neoDev {
    mods {
        "neoforge-coremods" {
            sourceSet project(":neoforge-coremods").sourceSets.main
        }
    }
}

