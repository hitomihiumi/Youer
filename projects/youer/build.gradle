    libraries 'ca.spottedleaf:concurrentutil:0.0.3'

    // Youer M3: librariesvault (above) deliberately excludes org.yaml/org.spongepowered - Paper declares
    // its own versions of these directly, matching that here.
    libraries "org.yaml:snakeyaml:2.2"
    libraries "org.spongepowered:configurate-yaml:4.2.0"
    libraries "me.lucko:spark-api:0.1-20240720.200737-2"
    libraries "me.lucko:spark-paper:1.10.133-20250413.112336-1"

    // Youer: mod-compat compileOnly shims (create/ponder/sable) temporarily removed for M1 — none of
