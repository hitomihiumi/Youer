name: Build

# The port is a patch set, not a source tree: `projects/youer/src` is generated by
# `./gradlew setup` from `patches/` and is gitignored. A checkout alone therefore cannot be
# compiled, and a stale copy of that directory survives `git pull` without being updated - which
# is the single most common way to get a wall of "cannot find symbol" errors locally. CI always
# starts from a clean clone, so a green run here means the branch itself is sound.

on:
  push:
    branches:
      - "1.21.8-toolchain"
      - "1.21.8**"
      - "1.21.1"
  pull_request:
    branches:
      - "1.21.8-toolchain"
      - "1.21.8**"
      - "1.21.1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build server jar
    runs-on: ubuntu-latest
    # A cold run decompiles Minecraft before it can compile anything; a warm one is far quicker.
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.gradle/caches, which is where the NeoForm runtime keeps the decompiled
          # Minecraft sources (~660 MB). That cache is what makes a warm run cheap.
          cache: gradle

      - name: Free disk space
        run: |
          # The decompile plus the bundled libraries in the server jar need several GB.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true
          df -h /

      - name: Apply patches
        run: .github/scripts/gradle.sh setup --stacktrace

      - name: Build
        run: .github/scripts/gradle.sh build --stacktrace

      - name: Assemble server jar
        run: .github/scripts/gradle.sh :youer:youerJar --stacktrace

      - name: Report artifacts
        run: ls -lh projects/youer/build/libs/

      - name: Upload server jar
        uses: actions/upload-artifact@v6
        with:
          name: youer-server-${{ github.sha }}
          path: projects/youer/build/libs/*-server.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer and universal jars
        uses: actions/upload-artifact@v6
        with:
          name: youer-installer-${{ github.sha }}
          path: |
            projects/youer/build/libs/*-installer.jar
            projects/youer/build/libs/*-universal.jar
          if-no-files-found: error
          retention-days: 14

  patch-drift:
    name: Patches round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true

      # `setup` writes `projects/youer/src` from `patches/`, and `genPatches` writes `patches/`
      # back from `projects/youer/src`. Round-tripping has to be a no-op; when it is not, someone
      # committed a patch that does not regenerate from its own output, and the next person to run
      # `setup` gets a diff they did not make.
      - name: Regenerate patches from a clean tree
        run: |
          .github/scripts/gradle.sh setup --stacktrace
          .github/scripts/gradle.sh :youer:genPatches --stacktrace

      - name: Fail if patches changed
        run: |
          if ! git diff --quiet -- patches/; then
            echo "::error::genPatches changed patches/ after a clean setup - the patch set does not round-trip."
            git diff --stat -- patches/
            git diff -- patches/ | head -200
            exit 1
          fi
          echo "patches/ round-trips cleanly."
