name: Release

# Builds a tag from a clean clone and attaches the jars to a GitHub Release.
# Deliberately does its own build rather than reusing the CI artifact, so a release is always
# traceable to one run over one checkout. Tags are rare; the extra time is worth the simplicity.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # gradleutils reads git metadata to name the jar, so the history has to be real.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost || true

      - name: Build
        run: |
          .github/scripts/gradle.sh setup --stacktrace
          .github/scripts/gradle.sh build :youer:youerJar --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -lh projects/youer/build/libs/
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            projects/youer/build/libs/*-server.jar \
            projects/youer/build/libs/*-installer.jar \
            projects/youer/build/libs/*-universal.jar
